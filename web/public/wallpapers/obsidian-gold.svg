<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ob-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060608"/>
      <stop offset="52%" stop-color="#0e0d12"/>
      <stop offset="100%" stop-color="#1b140d"/>
    </linearGradient>
    <radialGradient id="ob-aura" cx="73%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="46%" stop-color="#b45309" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ob-gold-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Deep Carbon-Obsidian Velvet Backdrop -->
  <rect width="1600" height="900" fill="url(#ob-bg)"/>
  <rect width="1600" height="900" fill="url(#ob-aura)"/>

  <!-- Subtle Gothic Observatory Tracery (Low-Frequency Left Zone for Code Readability) -->
  <g fill="none" stroke="#27272a" stroke-opacity="0.34">
    <path d="M110 900 L110 290 Q260 110 410 290 L410 900" stroke-width="2.2"/>
    <path d="M126 900 L126 302 Q260 136 394 302 L394 900" stroke-width="1"/>
    <path d="M470 900 L470 235 Q645 45 820 235 L820 900" stroke-width="2.4"/>
    <path d="M488 900 L488 248 Q645 72 802 248 L802 900" stroke-width="1"/>
    <circle cx="260" cy="248" r="46" stroke-width="1.2" stroke-opacity="0.26"/>
    <circle cx="645" cy="198" r="58" stroke-width="1.2" stroke-opacity="0.28"/>
    <line x1="0" y1="780" x2="1600" y2="780" stroke="#f59e0b" stroke-opacity="0.09" stroke-width="1"/>
  </g>

  <!-- Grand Celestial Golden Astrolabe (Framing Commander at Right Third) -->
  <g transform="translate(1168, 318)" fill="none">
    <circle cx="0" cy="0" r="312" stroke="url(#ob-gold-ring)" stroke-opacity="0.24" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="292" stroke="#fbbf24" stroke-opacity="0.38" stroke-width="1.1" stroke-dasharray="3 9"/>
    <circle cx="0" cy="0" r="248" stroke="url(#ob-gold-ring)" stroke-opacity="0.46" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="212" stroke="#f59e0b" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="12 8 3 8"/>
    <ellipse cx="0" cy="0" rx="358" ry="122" transform="rotate(-19)" stroke="#fde68a" stroke-opacity="0.46" stroke-width="1.8"/>
    <ellipse cx="0" cy="0" rx="326" ry="98" transform="rotate(-19)" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1.1" stroke-dasharray="6 6"/>
    <ellipse cx="0" cy="0" rx="285" ry="96" transform="rotate(26)" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="-345" y1="118" x2="345" y2="-118" stroke="#fde68a" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="0" y1="-336" x2="0" y2="336" stroke="#f59e0b" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="176" cy="-214" r="36" stroke="#fbbf24" stroke-opacity="0.48" stroke-width="1.6"/>
    <circle cx="176" cy="-214" r="5" fill="#fde68a" fill-opacity="0.8"/>
    <circle cx="242" cy="96" r="24" stroke="#f59e0b" stroke-opacity="0.38" stroke-width="1.4"/>
  </g>

  <!-- Ambient Constellation Thread & Floating Gold Stardust Embers -->
  <g stroke="#fbbf24" stroke-opacity="0.22" stroke-width="1" fill="none">
    <polyline points="620,338 712,286 785,262"/>
  </g>
  <g fill="#fde68a">
    <circle cx="620" cy="338" r="2.4" fill-opacity="0.58"/>
    <circle cx="712" cy="286" r="2.8" fill-opacity="0.68"/>
    <circle cx="785" cy="262" r="3.4" fill-opacity="0.8"/>
    <circle cx="545" cy="435" r="2.4" fill-opacity="0.48"/>
    <circle cx="842" cy="468" r="3.2" fill-opacity="0.65"/>
    <circle cx="964" cy="196" r="2.6" fill-opacity="0.74"/>
    <circle cx="1458" cy="244" r="3.6" fill-opacity="0.78"/>
    <circle cx="1492" cy="442" r="3" fill-opacity="0.62"/>
    <circle cx="1398" cy="612" r="2.5" fill-opacity="0.54"/>
