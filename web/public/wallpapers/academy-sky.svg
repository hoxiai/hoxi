<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ac-sky" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="38%" stop-color="#38bdf8"/>
      <stop offset="74%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <radialGradient id="ac-sun" cx="76%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="38%" stop-color="#e0f2fe" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ac-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="ac-cloud-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="68%" stop-color="#f0f9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="ac-beam" x1="0.9" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#e0f2fe" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ac-mullion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Clear Summer Coastal Sky -->
  <rect width="1600" height="900" fill="url(#ac-sky)"/>
  <rect width="1600" height="900" fill="url(#ac-sun)"/>

  <!-- Soft Distant Cirrus Wisps -->
  <path d="M90 176 Q290 142 510 168 T920 148 Q740 184 505 186 T90 176 Z" fill="#ffffff" fill-opacity="0.36"/>
  <path d="M240 242 Q430 218 640 238 T980 222 Q810 250 610 252 T240 242 Z" fill="#ffffff" fill-opacity="0.26"/>

  <!-- Organic Layered Summer Cumulus Clouds -->
  <path d="M-40 660 L-40 548 C25 538, 72 505, 118 512 C152 462, 224 446, 278 474 C316 408, 408 386, 476 426 C528 368, 636 372, 684 434 C742 418, 804 448, 826 496 C882 486, 944 514, 968 558 L1600 575 L1600 668 Z" fill="url(#ac-cloud-main)"/>
  <path d="M120 662 C185 598, 285 588, 356 618 C418 566, 535 562, 602 608 C675 578, 775 592, 838 634 L1600 628 L1600 676 L0 676 L0 648 C48 642, 86 648, 120 662 Z" fill="#e0f2fe" fill-opacity="0.72"/>

  <!-- Sunlit Coastal Sea Horizon & Shimmer -->
  <rect x="0" y="656" width="1600" height="244" fill="url(#ac-sea)"/>
  <path d="M0 656 Q400 648 820 658 T1600 652 L1600 674 Q1180 666 780 674 T0 668 Z" fill="#bae6fd" fill-opacity="0.55"/>
  <g stroke="#f0f9ff" stroke-linecap="round">
    <line x1="210" y1="686" x2="345" y2="686" stroke-width="2.2" stroke-opacity="0.58"/>
    <line x1="420" y1="704" x2="590" y2="704" stroke-width="2.5" stroke-opacity="0.62"/>
    <line x1="310" y1="726" x2="465" y2="726" stroke-width="2" stroke-opacity="0.45"/>
    <line x1="510" y1="748" x2="660" y2="748" stroke-width="1.8" stroke-opacity="0.4"/>
    <line x1="165" y1="762" x2="290" y2="762" stroke-width="1.6" stroke-opacity="0.34"/>
  </g>

  <!-- Sunlit Seaside Classroom Window Architecture (Framing Right Third) -->
  <polygon points="828,0 866,0 866,900 828,900" fill="url(#ac-mullion)"/>
  <line x1="866" y1="0" x2="866" y2="900" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9"/>
  <polygon points="866,0 1600,0 1600,56 866,98" fill="#f1f5f9" fill-opacity="0.76"/>
  <line x1="1268" y1="75" x2="1268" y2="900" stroke="#f8fafc" stroke-width="7" stroke-opacity="0.68"/>
  <line x1="866" y1="542" x2="1600" y2="512" stroke="#f8fafc" stroke-width="6" stroke-opacity="0.64"/>

  <!-- Warm Sunlit Window Sill -->
  <polygon points="790,792 1600,746 1600,900 790,900" fill="#f8fafc" fill-opacity="0.88"/>
  <polygon points="790,792 1600,746 1600,768 790,814" fill="#fef3c7" fill-opacity="0.82"/>
  <line x1="790" y1="792" x2="1600" y2="746" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Soft Tyndall Sunbeams -->
  <polygon points="1480,0 1600,0 1080,900 860,900" fill="url(#ac-beam)"/>
  <polygon points="1210,0 1320,0 760,900 635,900" fill="url(#ac-beam)"/>

  <!-- Crisp Vector Sea-Breeze Prism Sparkles -->
  <g fill="#ffffff" fill-opacity="0.86">
    <path d="M920 218 L924 230 L936 234 L924 238 L920 250 L916 238 L904 234 L916 230 Z"/>
    <path d="M1468 186 L1471 196 L1481 199 L1471 202 L1468 212 L1465 202 L1455 199 L1465 196 Z"/>
    <path d="M1015 418 L1017.5 425.5 L1025 428 L1017.5 430.5 L1015 438 L1012.5 430.5 L1005 428 L1012.5 425.5 Z" fill="#e0f2fe"/>
    <circle cx="775" cy="295" r="3.5" fill-opacity="0.65"/>
    <circle cx="968" cy="312" r="4.5" fill-opacity="0.72"/>
    <circle cx="1435" cy="364" r="4" fill-opacity="0.7"/>
    <circle cx="1512" cy="285" r="3" fill-opacity="0.6"/>
  </g>
</svg>
