<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050712"/>
      <stop offset="52%" stop-color="#110c29"/>
      <stop offset="100%" stop-color="#081c30"/>
    </linearGradient>
    <radialGradient id="cy-mag" cx="78%" cy="36%" r="46%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.44"/>
      <stop offset="52%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cy-cyan" cx="66%" cy="72%" r="44%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.36"/>
      <stop offset="58%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cy-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131936"/>
      <stop offset="100%" stop-color="#070a18"/>
    </linearGradient>
    <linearGradient id="cy-neon-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="cy-neon-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <!-- Deep Midnight Rain-Night Base & Neon Atmospheric Glows -->
  <rect width="1600" height="900" fill="url(#cy-bg)"/>
  <rect width="1600" height="900" fill="url(#cy-mag)"/>
  <rect width="1600" height="900" fill="url(#cy-cyan)"/>

  <!-- Distant Low-Contrast Skyline (Left Reading Zone Kept Calm) -->
  <g fill="#0a0f22" fill-opacity="0.62">
    <rect x="90" y="420" width="96" height="480"/>
    <rect x="215" y="350" width="118" height="550"/>
    <rect x="365" y="455" width="88" height="445"/>
    <rect x="490" y="305" width="112" height="595"/>
    <rect x="630" y="245" width="118" height="655"/>
  </g>

  <!-- Shibuya Neon High-Rise Towers (Right Third Framing Standee) -->
  <g fill="url(#cy-tower)" stroke="#312e81" stroke-width="1.4" stroke-opacity="0.72">
    <rect x="812" y="135" width="118" height="765"/>
    <rect x="954" y="68" width="156" height="832"/>
    <rect x="1136" y="168" width="134" height="732"/>
    <rect x="1294" y="88" width="164" height="812"/>
    <rect x="1478" y="148" width="122" height="752"/>
  </g>

  <!-- Vertical Neon Billboards & Window Horizon Strips -->
  <rect x="980" y="176" width="38" height="162" rx="6" fill="url(#cy-neon-pink)"/>
  <rect x="1322" y="196" width="48" height="196" rx="6" fill="url(#cy-neon-cyan)"/>
  <rect x="1502" y="254" width="40" height="146" rx="6" fill="#a855f7" fill-opacity="0.7"/>
  <g stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2">
    <line x1="832" y1="220" x2="908" y2="220"/>
    <line x1="832" y1="242" x2="892" y2="242"/>
    <line x1="1158" y1="264" x2="1246" y2="264"/>
    <line x1="1158" y1="286" x2="1224" y2="286"/>
  </g>

  <!-- Soft Out-of-Focus Rain-Night Neon Bokeh Orbs -->
  <circle cx="715" cy="465" r="24" fill="#38bdf8" fill-opacity="0.22"/>
  <circle cx="868" cy="396" r="32" fill="#ec4899" fill-opacity="0.34"/>
  <circle cx="942" cy="520" r="26" fill="#22d3ee" fill-opacity="0.28"/>
  <circle cx="1442" cy="468" r="44" fill="#d946ef" fill-opacity="0.34"/>
  <circle cx="1528" cy="590" r="30" fill="#22d3ee" fill-opacity="0.26"/>

  <!-- Crisp Vector Holographic Cyber Ring Behind Hacker Standee -->
  <g transform="translate(1188, 342)" fill="none">
    <circle cx="0" cy="0" r="268" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="244" stroke="#ec4899" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="14 8 3 8"/>
    <circle cx="0" cy="0" r="196" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- Penthouse Window Mullion & Diagonal Rain Streaks -->
  <rect x="774" y="0" width="12" height="900" fill="#0f172a" fill-opacity="0.9"/>
  <line x1="786" y1="0" x2="786" y2="900" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.4"/>
  <g stroke="#67e8f9" stroke-opacity="0.24" stroke-width="1.5" stroke-linecap="round">
    <line x1="848" y1="74" x2="812" y2="206"/>
    <line x1="988" y1="42" x2="948" y2="188"/>
    <line x1="1176" y1="92" x2="1138" y2="236"/>
    <line x1="1476" y1="68" x2="1434" y2="224"/>
    <line x1="896" y1="518" x2="862" y2="652"/>
    <line x1="650" y1="168" x2="620" y2="282" stroke-opacity="0.14"/>
  </g>
</svg>
