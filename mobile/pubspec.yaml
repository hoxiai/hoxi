name: hoxi
description: "Hoxi Remote — open-source mobile controller for Hoxi Desktop (Code mode)."
publish_to: "none"
version: 0.7.5+7005

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  xterm: ^4.0.0
  flutter_markdown_plus: ^1.0.12
  intl: any
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - web/icons/Icon-192.png
