name: Bug Report
description: Report a reproducible bug in Hoxi Desktop, CLI, Chrome Link, or Mobile
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! **Never include real API keys, tokens, or private session content.** For security vulnerabilities, please follow [SECURITY.md](https://github.com/hoxiai/hoxi/blob/main/SECURITY.md) instead of opening a public issue.

  - type: input
    id: version
    attributes:
      label: Hoxi Version
      description: Output of `hoxi --version` or Settings -> About
      placeholder: "v0.6.19"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating System & Architecture
      options:
        - macOS (Apple Silicon arm64)
        - macOS (Intel x64)
        - Windows 10/11 (x64)
        - Windows 10/11 (ARM64)
        - Linux (x64)
        - iOS / Android (Hoxi Mobile)
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Agent Runtime
      options:
        - Hoxi Native Engine (built-in)
        - Claude Code CLI
        - OpenAI Codex CLI
        - OpenCode
        - Google Antigravity (agy)
        - Gemini CLI
        - Qoder / CodeBuddy
        - Not applicable (UI / Host / Remote)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Open workspace ...
        2. Start a session with ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs or Screenshots (Optional)
      description: Paste relevant error messages or redacted logs (strip tokens and personal paths)
      render: text
