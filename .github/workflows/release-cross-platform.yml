name: Release Windows and Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: "Windows: Build x64 Client & Release"
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node scripts/release-artifact.mjs version "$RELEASE_TAG")"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e '
            const fs = require("node:fs");
            const v = process.argv[1] + ".0";
            const info = JSON.parse(fs.readFileSync("build/windows/info.json", "utf8"));
            info.fileVersion = v;
            info.productVersion = v;
            fs.writeFileSync("build/windows/info.json", JSON.stringify(info, null, 2) + "\n");
          ' "$VERSION"

      - name: Install frontend dependencies & Build web
        shell: bash
        env:
          HOXI_WORK_TOKEN: ${{ secrets.HOXI_WORK_TOKEN }}
        run: |
          if [[ -n "${HOXI_WORK_TOKEN:-}" && ! -d "../hoxi-work" ]]; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOXI_WORK_TOKEN" | base64 | tr -d '\r\n')" \
              clone --depth 1 https://github.com/hoxiai/hoxi-work.git ../hoxi-work
          fi
          if [[ -d "../hoxi-work/skills" ]]; then
            for skill_src in ../hoxi-work/skills/*; do
              [[ -d "${skill_src}" && -f "${skill_src}/SKILL.md" ]] || continue
              target_dir="internal/skills/defaults/$(basename "${skill_src}")"
              [[ -d "${target_dir}" ]] || cp -R "${skill_src}" "${target_dir}"
            done
          fi
          npm --prefix web ci
          npm --prefix web run build

      - name: Run Windows Go vet
        run: go vet ./...

      - name: Run Windows computer control regressions
        run: go test ./internal/computer


      - name: Install Wails v2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Windows Desktop App
        shell: bash
        run: |
          wails build -platform windows/amd64 -s -m -nosyncgomod \
            -ldflags "-X github.com/hoxiai/hoxi/internal/app.BuildVariant=release -X github.com/hoxiai/hoxi/internal/buildinfo.Version=${RELEASE_VERSION}"
          test "$(./build/bin/Hoxi.exe --version | tr -d '\r\n')" = "${RELEASE_VERSION}"

      - name: Bundle OpenCode Runtime
        shell: bash
        run: |
          OPENCODE_ZIP="opencode-windows-x64.zip"
          node scripts/opencode-lock.mjs verify
          curl -fsSL -o "$OPENCODE_ZIP" "$(node scripts/opencode-lock.mjs url windows/amd64)"
          node scripts/opencode-lock.mjs verify-archive windows/amd64 "$OPENCODE_ZIP"
          7z e "$OPENCODE_ZIP" opencode.exe -obuild/bin/
          rm -f "$OPENCODE_ZIP"
          test -f build/bin/opencode.exe
          echo "Bundled standalone opencode.exe into build/bin/"

      - name: Package Windows Release Archive
        shell: bash
        run: |
          ZIP_NAME="Hoxi-${RELEASE_VERSION}-windows-amd64.zip"
          cd build/bin
          7z a "$ZIP_NAME" Hoxi.exe opencode.exe
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Upload Windows Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/bin/Hoxi-${{ env.RELEASE_VERSION }}-windows-amd64.zip
            build/bin/Hoxi-${{ env.RELEASE_VERSION }}-windows-amd64.zip.sha256
          draft: false
          prerelease: false

  build-linux:
    name: "Linux: Build x64 Client & Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Linux Desktop Dependencies (WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node scripts/release-artifact.mjs version "$RELEASE_TAG")"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies & Build web
        shell: bash
        env:
          HOXI_WORK_TOKEN: ${{ secrets.HOXI_WORK_TOKEN }}
        run: |
          if [[ -n "${HOXI_WORK_TOKEN:-}" && ! -d "../hoxi-work" ]]; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOXI_WORK_TOKEN" | base64 | tr -d '\r\n')" \
              clone --depth 1 https://github.com/hoxiai/hoxi-work.git ../hoxi-work
          fi
          if [[ -d "../hoxi-work/skills" ]]; then
            for skill_src in ../hoxi-work/skills/*; do
              [[ -d "${skill_src}" && -f "${skill_src}/SKILL.md" ]] || continue
              target_dir="internal/skills/defaults/$(basename "${skill_src}")"
              [[ -d "${target_dir}" ]] || cp -R "${skill_src}" "${target_dir}"
            done
          fi
          npm --prefix web ci
          npm --prefix web run build

      - name: Install Wails v2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Linux Desktop App
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -s -m -nosyncgomod \
            -ldflags "-X github.com/hoxiai/hoxi/internal/app.BuildVariant=release -X github.com/hoxiai/hoxi/internal/buildinfo.Version=${RELEASE_VERSION}"

      - name: Bundle OpenCode Runtime
        run: |
          OPENCODE_TAR="opencode-linux-x64.tar.gz"
          node scripts/opencode-lock.mjs verify
          curl -fsSL -o "$OPENCODE_TAR" "$(node scripts/opencode-lock.mjs url linux/amd64)"
          node scripts/opencode-lock.mjs verify-archive linux/amd64 "$OPENCODE_TAR"
          tar -xzf "$OPENCODE_TAR" -C build/bin/ opencode
          rm -f "$OPENCODE_TAR"
          chmod +x build/bin/opencode
          test -x build/bin/opencode
          echo "Bundled standalone opencode into build/bin/"

      - name: Package Linux Release Archive
        run: |
          TAR_NAME="Hoxi-${RELEASE_VERSION}-linux-amd64.tar.gz"
          cp build/linux/hoxi.desktop build/bin/
          cp build/appicon.png build/bin/hoxi.png
          cd build/bin
          tar -czf "$TAR_NAME" Hoxi opencode hoxi.desktop hoxi.png

      - name: Upload Linux Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/bin/Hoxi-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz
          draft: false
          prerelease: false
