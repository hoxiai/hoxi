name: Release Windows and Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: "Windows: Build x64 Client & Release"
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node scripts/release-artifact.mjs version "$RELEASE_TAG")"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies & Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Install Wails v2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Windows Desktop App
        shell: bash
        run: |
          wails build -platform windows/amd64 -s -m -nosyncgomod \
            -ldflags "-X github.com/hoxiai/hoxi/internal/app.BuildVariant=release -X github.com/hoxiai/hoxi/internal/buildinfo.Version=${RELEASE_VERSION}"

      - name: Bundle OpenCode Runtime
        shell: bash
        run: |
          OPENCODE_ZIP="opencode-windows-x64.zip"
          curl -fsSL -o "$OPENCODE_ZIP" https://github.com/anomalyco/opencode/releases/latest/download/opencode-windows-x64.zip
          7z e "$OPENCODE_ZIP" opencode.exe -obuild/bin/
          rm -f "$OPENCODE_ZIP"
          test -f build/bin/opencode.exe
          echo "Bundled standalone opencode.exe into build/bin/"

      - name: Package Windows Release Archive
        shell: bash
        run: |
          ZIP_NAME="Hoxi-${RELEASE_VERSION}-windows-amd64.zip"
          cd build/bin
          7z a "$ZIP_NAME" Hoxi.exe opencode.exe

      - name: Upload Windows Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/bin/Hoxi-${{ env.RELEASE_VERSION }}-windows-amd64.zip
          draft: false
          prerelease: false

      - name: Upload Windows Artifact to GitCode
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_UPLOAD_CURL: "1"
        run: |
          : "${GITCODE_TOKEN:?GITCODE_TOKEN is required for dual release}"
          node scripts/gitcode-release.mjs --append --version "$RELEASE_VERSION" \
            --notes "Hoxi Desktop v${RELEASE_VERSION}" \
            "build/bin/Hoxi-${RELEASE_VERSION}-windows-amd64.zip"

  build-linux:
    name: "Linux: Build x64 Client & Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Linux Desktop Dependencies (WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node scripts/release-artifact.mjs version "$RELEASE_TAG")"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies & Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Install Wails v2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Linux Desktop App
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -s -m -nosyncgomod \
            -ldflags "-X github.com/hoxiai/hoxi/internal/app.BuildVariant=release -X github.com/hoxiai/hoxi/internal/buildinfo.Version=${RELEASE_VERSION}"

      - name: Bundle OpenCode Runtime
        run: |
          OPENCODE_TAR="opencode-linux-x64.tar.gz"
          curl -fsSL -o "$OPENCODE_TAR" https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz
          tar -xzf "$OPENCODE_TAR" -C build/bin/ opencode
          rm -f "$OPENCODE_TAR"
          chmod +x build/bin/opencode
          test -x build/bin/opencode
          echo "Bundled standalone opencode into build/bin/"

      - name: Package Linux Release Archive
        run: |
          TAR_NAME="Hoxi-${RELEASE_VERSION}-linux-amd64.tar.gz"
          cp build/linux/hoxi.desktop build/bin/
          cp build/appicon.png build/bin/hoxi.png
          cd build/bin
          tar -czf "$TAR_NAME" Hoxi opencode hoxi.desktop hoxi.png

      - name: Upload Linux Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/bin/Hoxi-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz
          draft: false
          prerelease: false

      - name: Upload Linux Artifact to GitCode
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_UPLOAD_CURL: "1"
        run: |
          : "${GITCODE_TOKEN:?GITCODE_TOKEN is required for dual release}"
          node scripts/gitcode-release.mjs --append --version "$RELEASE_VERSION" \
            --notes "Hoxi Desktop v${RELEASE_VERSION}" \
            "build/bin/Hoxi-${RELEASE_VERSION}-linux-amd64.tar.gz"
