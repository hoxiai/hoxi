name: Release Desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: "macOS: Build, Sign, DMG & Release"
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HOXI_SPARKLE_PUBLIC_KEY: ${{ secrets.HOXI_SPARKLE_PUBLIC_KEY }}
      HOXI_SPARKLE_FEED_URL: ${{ vars.HOXI_SPARKLE_FEED_URL }}

    steps:
      # The runner context is unavailable in job-level env, so derive temp paths here.
      - name: Set runner temp paths
        run: |
          echo "HOXI_SPARKLE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
          echo "HOXI_SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle-private-key" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        env:
          HOXI_WORK_TOKEN: ${{ secrets.HOXI_WORK_TOKEN }}
        run: |
          if [[ ! -d "../hoxi-work" ]]; then
            : "${HOXI_WORK_TOKEN:?HOXI_WORK_TOKEN secret is required to bundle the Work surface in release builds}"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOXI_WORK_TOKEN" | base64 | tr -d '\r\n')" \
              clone --depth 1 https://github.com/hoxiai/hoxi-work.git ../hoxi-work
          fi
          test -f "../hoxi-work/web/index.tsx"
          npm --prefix web ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node scripts/release-artifact.mjs version "$RELEASE_TAG")"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Resolve release notes
        run: |
          NOTES_FILE="docs/release-notes/v${RELEASE_VERSION}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            {
              echo 'RELEASE_NOTES<<HOXI_RELEASE_NOTES_EOF'
              cat "$NOTES_FILE"
              echo 'HOXI_RELEASE_NOTES_EOF'
            } >> "$GITHUB_ENV"
          else
            echo "RELEASE_NOTES=Hoxi Desktop v${RELEASE_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Run release checks
        run: |
          npm --prefix web run lint
          npm --prefix web test
          node --test scripts/release.test.mjs internal/opencode/browser_plugin_test.mjs
          npm --prefix web run build
          go vet ./...
          go test -race -count=1 ./...
          go build -tags desktop ./...

      - name: Prepare pinned distribution tools
        env:
          SPARKLE_URL: ${{ vars.HOXI_SPARKLE_ARCHIVE_URL }}
          SPARKLE_SHA256: ${{ vars.HOXI_SPARKLE_ARCHIVE_SHA256 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.HOXI_SPARKLE_PRIVATE_KEY }}
          HOXI_RELEASE_KEY: ${{ secrets.HOXI_RELEASE_KEY }}
          APAY_RELEASE_KEY: ${{ secrets.APAY_RELEASE_KEY }}
        run: |
          node scripts/opencode-lock.mjs verify
          OPENCODE_URL="$(node scripts/opencode-lock.mjs url darwin/arm64)"
          OPENCODE_SHA256="$(node scripts/opencode-lock.mjs sha256 darwin/arm64)"
          : "${HOXI_SPARKLE_PUBLIC_KEY:?Sparkle public key required}"
          : "${HOXI_SPARKLE_FEED_URL:?Official feed URL required}"
          : "${SPARKLE_PRIVATE_KEY:?Sparkle private key required}"
          : "${APAY_RELEASE_KEY:?Unified release-center credential required (APAY_RELEASE_KEY)}"
          : "${SPARKLE_URL:?Pinned official Sparkle archive URL required}"
          : "${SPARKLE_SHA256:?Sparkle SHA-256 required}"
          : "${OPENCODE_URL:?Pinned official OpenCode ZIP URL required}"
          : "${OPENCODE_SHA256:?OpenCode SHA-256 required}"
          [[ "$SPARKLE_URL" == https://github.com/sparkle-project/Sparkle/releases/download/* ]]
          [[ "$OPENCODE_URL" == https://github.com/anomalyco/opencode/releases/download/* ]]
          [[ "$SPARKLE_SHA256" =~ ^[a-f0-9]{64}$ && "$OPENCODE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' "$SPARKLE_URL" -o "$RUNNER_TEMP/sparkle.tar.xz"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOXI_SPARKLE_DIR" "$RUNNER_TEMP/opencode"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$HOXI_SPARKLE_DIR"
          curl --fail --location --proto '=https' --proto-redir '=https' "$OPENCODE_URL" -o "$RUNNER_TEMP/opencode.zip"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$RUNNER_TEMP/opencode.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/opencode.zip" "$RUNNER_TEMP/opencode"
          test -x "$RUNNER_TEMP/opencode/opencode"
          echo "HOXI_OPENCODE=$RUNNER_TEMP/opencode/opencode" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$HOXI_SPARKLE_PRIVATE_KEY_FILE"
          node scripts/sparkle.mjs check

      - name: Import Apple Developer Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE is required for releases}"
          : "${MACOS_CERTIFICATE_PWD:?MACOS_CERTIFICATE_PWD is required for releases}"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 16)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Setup Apple Notarization Profile
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          : "${APPLE_API_KEY:?APPLE_API_KEY is required for releases}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required for releases}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required for releases}"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials "hoxi-notary" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build Production macOS App and DMG
        run: |
          ./build-desktop.sh --release-only --dmg --no-install \
            --version "$RELEASE_VERSION" --notarize --notary-profile "hoxi-notary"

      - name: Verify release artifact and generate checksums
        run: |
          DMG="build/bin/Hoxi-${RELEASE_VERSION}-darwin-arm64.dmg"
          mv build/bin/Hoxi.dmg "$DMG"
          node scripts/release-artifact.mjs verify-dmg "$DMG" "$RELEASE_VERSION" > build/bin/release-artifact.json
          node scripts/release-artifact.mjs verify-distribution "$DMG"
          (cd build/bin && shasum -a 256 "Hoxi-${RELEASE_VERSION}-darwin-arm64.dmg" > checksums.txt)
          node scripts/sparkle.mjs sign-update "$DMG" "$RELEASE_VERSION" build/bin/sparkle.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hoxi Desktop v${{ env.RELEASE_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            build/bin/Hoxi-${{ env.RELEASE_VERSION }}-darwin-arm64.dmg
            build/bin/checksums.txt
            build/bin/sparkle.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Publish website metadata after asset upload
        env:
          APAY_RELEASE_KEY: ${{ secrets.APAY_RELEASE_KEY }}
          APAY_RELEASE_API_URL: ${{ vars.APAY_RELEASE_API_URL }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          node --input-type=module - "$RELEASE_VERSION" <<'JS' | node scripts/release-publisher.mjs
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const version = process.argv[2];
          const bytes = fs.readFileSync(`build/bin/Hoxi-${version}-darwin-arm64.dmg`);
          const verified = JSON.parse(fs.readFileSync('build/bin/release-artifact.json', 'utf8'));
          console.log(JSON.stringify({...verified, version, notes: process.env.RELEASE_NOTES || `Hoxi Desktop v${version}`, size: bytes.length,
            sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            sparkle: JSON.parse(fs.readFileSync('build/bin/sparkle.json', 'utf8'))}));
          JS

      - name: Clean up signing credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "${APPLE_API_KEY_PATH:-}"
          rm -f "$HOXI_SPARKLE_PRIVATE_KEY_FILE"
